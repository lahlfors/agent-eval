experiment_name: "adk-agent-evaluation"
run_name_prefix: "eval-run-01"

agent_adapter_class: "agent_eval_framework.adapters.callable_adapter.CallableAgentAdapter"

agent_config:
  target: "examples.mono_agent_example:run_agent"
  response_key: "response"
  trajectory_key: "trajectory"

dataset_path: "agent-eval-framework/data/simple.test.jsonl"

column_mapping:
  query: "prompt"
  reference_answer: "reference"
  trajectory: "reference_trajectory" # Ground truth tool calls

metrics:
  # Agent Trajectory Metrics (as strings)
  - "trajectory_exact_match"
  # - "trajectory_in_order_match"
  # - "trajectory_any_order_match"
  # - "trajectory_precision"
  # - "trajectory_recall"

  # Standard Computation Metrics for Final Response
  - "exact_match"
  - "bleu"
  - "rouge_l_sum"
