[project]
name = "agent-eval-harness"
version = "0.2.0"
description = "Universal Evaluation Test Harness for Mono-Agent and Multi-Agent Systems on Google Cloud Vertex AI"
authors = [{ name = "laah", email = "laah@google.com" }]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
google-cloud-aiplatform = {extras = ["evaluation"], version = ">=1.49.0"}
google-genai = ">=1.3.0"
google-adk = {version = ">=1.15.0", extras = ["eval"]}
google-cloud-storage = ">=2.18.0"
pydantic = ">=2.10.0"
python-dotenv = ">=1.0.1"
pyyaml = ">=6.0.2"
pandas = ">=2.2.2"
requests = ">=2.31.0"
tabulate = ">=0.9.0"
rich = ">=13.9.4"
agent-eval-framework = {path = "agent-eval-framework", develop = true}

# OpenTelemetry Packages
google-auth = ">=2.30.0"
opentelemetry-api = ">=1.20.0"
opentelemetry-sdk = ">=1.20.0"
opentelemetry-instrumentation-logging = ">=0.40b0"
opentelemetry-exporter-otlp-proto-http = ">=1.20.0"
opentelemetry-exporter-otlp = ">=1.20.0"
google-cloud-trace = ">=1.10.0"
python-json-logger = ">=2.0.7"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
pytest-mock = "^3.12.0"
ipython = "^8.26.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-p pytest_mock"
